<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 تطبيق الطقس الكامل - Full Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #27AE60;
            --warning: #F39C12;
            --danger: #E74C3C;
            --light: #ECF0F1;
            --dark: #2C3E50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .phone-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .phone-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .phone-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .search-area {
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            gap: 10px;
        }

        .search-area input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .search-area button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .weather-display {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .city-name {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .weather-icon-large {
            font-size: 6em;
            margin: 20px 0;
        }

        .temp-large {
            font-size: 3em;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .weather-status {
            font-size: 1.1em;
            color: #555;
            text-transform: capitalize;
        }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: #f5f5f5;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5em;
            padding: 10px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            transform: scale(1.2);
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .panel {
            display: none;
            padding: 20px;
        }

        .panel.active {
            display: block;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            color: #999;
            font-weight: bold;
        }

        .detail-value {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1em;
        }

        .alert {
            background: var(--warning);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mini-forecast {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 0;
        }

        .mini-card {
            flex: 0 0 70px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
        }

        .mini-icon {
            font-size: 2em;
            margin: 5px 0;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="phone-header">
            <h1>📱 Weather</h1>
            <p>طقس الآن</p>
        </div>

        <div class="search-area">
            <input type="text" id="phoneInput" placeholder="Search..." onkeypress="handlePhoneSearch(event)">
            <button onclick="phoneSearch()">🔍</button>
        </div>

        <div class="weather-display" id="weatherDisplay">
            <div class="loading-spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <div class="footer-nav">
            <button class="nav-btn active" onclick="switchPanel('now')">🏠</button>
            <button class="nav-btn" onclick="switchPanel('hourly')">⏰</button>
            <button class="nav-btn" onclick="switchPanel('details')">📊</button>
            <button class="nav-btn" onclick="switchPanel('alerts')">⚠️</button>
        </div>
    </div>

    <script>
        let currentWeatherData = null;
        let currentLocation = 'Cairo';

        async function phoneSearch() {
            const city = document.getElementById('phoneInput').value || currentLocation;
            const display = document.getElementById('weatherDisplay');
            display.innerHTML = '<div class="loading-spinner"></div><p>جاري التحميل...</p>';

            try {
                const data = await fetchWeather(city);
                currentWeatherData = data;
                currentLocation = city;
                displayPhoneWeather();
                switchPanel('now');
            } catch (error) {
                display.innerHTML = '<p>❌ خطأ في تحميل البيانات</p>';
            }
        }

        async function fetchWeather(city) {
            const geocoding = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=ar&format=json`);
            const geoData = await geocoding.json();
            
            if (!geoData.results || geoData.results.length === 0) {
                throw new Error('City not found');
            }

            const location = geoData.results[0];
            const weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,weather_code,humidity,wind_speed_10m&hourly=temperature_2m,weather_code&timezone=auto`);
            const weatherData = await weather.json();

            return {
                location,
                current: weatherData.current,
                hourly: weatherData.hourly
            };
        }

        function getWeatherIcon(code) {
            if (code === 0 || code === 1) return '☀️';
            if (code === 2) return '⛅';
            if (code === 3) return '☁️';
            if (code === 45 || code === 48) return '🌫️';
            if (code >= 51 && code <= 99) return code >= 71 ? '❄️' : '🌧️';
            return '🌤️';
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: 'سماء صافية',
                1: 'صافي في الغالب',
                2: 'غائم جزئياً',
                3: 'غائم',
                45: 'ضباب',
                51: 'رذاذ',
                61: 'مطر',
                71: 'ثلج',
                95: 'عاصفة رعدية'
            };
            return descriptions[code] || 'غير معروف';
        }

        function displayPhoneWeather() {
            const display = document.getElementById('weatherDisplay');
            const temp = Math.round(currentWeatherData.current.temperature_2m);
            const icon = getWeatherIcon(currentWeatherData.current.weather_code);
            const desc = getWeatherDescription(currentWeatherData.current.weather_code);

            display.innerHTML = `
                <div class="city-name">${currentWeatherData.location.name}</div>
                <div class="weather-icon-large">${icon}</div>
                <div class="temp-large">${temp}°</div>
                <div class="weather-status">${desc}</div>
            `;
        }

        function switchPanel(panel) {
            // Update buttons
            document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update display
            const display = document.getElementById('weatherDisplay');
            
            if (panel === 'now') {
                displayPhoneWeather();
            } else if (panel === 'hourly') {
                let html = '';
                for (let i = 0; i < 12; i++) {
                    const hour = new Date(currentWeatherData.hourly.time[i]).getHours();
                    const temp = Math.round(currentWeatherData.hourly.temperature_2m[i]);
                    const icon = getWeatherIcon(currentWeatherData.hourly.weather_code[i]);
                    html += `<div class="mini-card"><div>${hour}:00</div><div class="mini-icon">${icon}</div><div>${temp}°</div></div>`;
                }
                display.innerHTML = '<div class="mini-forecast">' + html + '</div>';
            } else if (panel === 'details') {
                display.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">💧 الرطوبة:</span>
                        <span class="detail-value">${currentWeatherData.current.humidity}%</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">💨 الريح:</span>
                        <span class="detail-value">${Math.round(currentWeatherData.current.wind_speed_10m)} km/h</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">🌡️ الحرارة:</span>
                        <span class="detail-value">${Math.round(currentWeatherData.current.temperature_2m)}°C</span>
                    </div>
                `;
            } else if (panel === 'alerts') {
                const wind = currentWeatherData.current.wind_speed_10m;
                let alerts = '';
                if (wind > 40) {
                    alerts += '<div class="alert" style="background: #E74C3C;">⚠️ تحذير: رياح قوية جداً</div>';
                }
                if (currentWeatherData.current.weather_code >= 80) {
                    alerts += '<div class="alert" style="background: #3498DB;">⚠️ تحذير: أمطار غزيرة</div>';
                }
                display.innerHTML = alerts || '<p>✅ لا توجد تحذيرات</p>';
            }
        }

        function handlePhoneSearch(e) {
            if (e.key === 'Enter') phoneSearch();
        }

        // Load default city on start
        window.addEventListener('load', phoneSearch);
    </script>
</body>
</html>
